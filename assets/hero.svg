<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Elijah developer profile banner</title>
  <desc id="desc">Dark cyber-noir banner with red and orange accents for Elijah, focused on web, automation and applied AI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07090D" />
      <stop offset="0.52" stop-color="#0D1117" />
      <stop offset="1" stop-color="#120704" />
    </linearGradient>
    <linearGradient id="brand" x1="220" y1="90" x2="880" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="0.28" stop-color="#FFB000" />
      <stop offset="0.63" stop-color="#FF5A1F" />
      <stop offset="1" stop-color="#E51900" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D00" stop-opacity="0" />
      <stop offset="0.5" stop-color="#FF6A00" />
      <stop offset="1" stop-color="#FF2D00" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="flare">
      <stop stop-color="#FF5A1F" stop-opacity="0.42" />
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.045" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="358" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)" />
    <rect width="1280" height="360" fill="url(#grid)" />

    <circle cx="1080" cy="155" r="245" fill="url(#flare)">
      <animate attributeName="r" values="215;260;215" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1132" cy="180" r="104" stroke="#FF5A1F" stroke-opacity="0.34" />
    <circle cx="1132" cy="180" r="72" stroke="#FF7A00" stroke-opacity="0.55" stroke-dasharray="6 12">
      <animateTransform attributeName="transform" type="rotate" from="0 1132 180" to="360 1132 180" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="1132" cy="180" r="41" stroke="#FFFFFF" stroke-opacity="0.36" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360 1132 180" to="0 1132 180" dur="12s" repeatCount="indefinite" />
    </circle>
    <path d="M1004 180H1260M1132 52V308" stroke="#FF5A1F" stroke-opacity="0.18" />

    <path d="M900 -20L1280 188V360H1120L780 142L900 -20Z" fill="#FF4D00" fill-opacity="0.035" />
    <path d="M1010 -20L1280 128" stroke="#FF6A00" stroke-opacity="0.24" />
    <path d="M870 360L1280 120" stroke="#FF2D00" stroke-opacity="0.18" />

    <g font-family="Segoe UI, Inter, Arial, sans-serif">
      <text x="64" y="55" fill="#8B949E" font-size="14" font-weight="700" letter-spacing="4">ELIJAH // 01</text>
      <text x="1216" y="55" fill="#8B949E" font-size="14" font-weight="600" letter-spacing="2" text-anchor="end">SALVADOR • BAHIA • BRAZIL</text>

      <text x="62" y="202" fill="url(#brand)" font-size="104" font-weight="900" letter-spacing="9" filter="url(#glow)">ELIJAH</text>
      <text x="68" y="246" fill="#E6EDF3" font-size="22" font-weight="600" letter-spacing="7">WEB • AUTOMATION • APPLIED AI</text>
      <text x="68" y="283" fill="#8B949E" font-size="16" font-weight="500" letter-spacing="1.2">Turning curiosity into things people can actually use.</text>

      <circle cx="72" cy="320" r="5" fill="#FF6A00">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="88" y="325" fill="#C9D1D9" font-size="13" font-weight="700" letter-spacing="2">BUILDING / LEARNING / SHIPPING</text>
    </g>

    <rect x="-420" y="0" width="280" height="360" fill="url(#line)" opacity="0.13" transform="skewX(-18)">
      <animate attributeName="x" values="-420;1500" dur="6.5s" repeatCount="indefinite" />
    </rect>
  </g>

  <rect x="1" y="1" width="1278" height="358" rx="22" stroke="#FF5A1F" stroke-opacity="0.28" stroke-width="2" />
  <path d="M24 1H290" stroke="#FF6A00" stroke-width="2" />
  <path d="M990 359H1256" stroke="#FF2D00" stroke-width="2" />
</svg>

