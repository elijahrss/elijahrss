<svg width="620" height="330" viewBox="0 0 620 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Elijah terminal profile</title>
  <desc id="desc">Terminal-style card showing Elijah's identity, areas of focus and current status.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="620" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117" />
      <stop offset="1" stop-color="#120805" />
    </linearGradient>
    <linearGradient id="stroke" x1="30" y1="20" x2="590" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A00" />
      <stop offset="0.5" stop-color="#FF3D00" stop-opacity="0.34" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.12" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="618" height="328" rx="18" fill="url(#panel)" stroke="url(#stroke)" stroke-width="2" />
  <path d="M1 54H619" stroke="#30363D" />

  <circle cx="27" cy="28" r="6" fill="#FF453A" />
  <circle cx="49" cy="28" r="6" fill="#FF9F0A" />
  <circle cx="71" cy="28" r="6" fill="#30D158" />
  <text x="310" y="34" fill="#8B949E" font-size="13" text-anchor="middle" font-family="Consolas, Menlo, monospace">eli@github — zsh</text>

  <g font-family="Consolas, Menlo, monospace" font-size="17">
    <g>
      <text x="28" y="88" fill="#FF7A00">eli@github:~$</text>
      <text x="190" y="88" fill="#E6EDF3">whoami</text>
    </g>
    <g>
      <text x="28" y="119" fill="#C9D1D9">Elias Tavares · @elijahrss</text>
    </g>

    <g>
      <text x="28" y="164" fill="#FF7A00">eli@github:~$</text>
      <text x="190" y="164" fill="#E6EDF3">focus</text>
    </g>
    <g>
      <text x="28" y="195" fill="#C9D1D9">Web · Automation · Applied AI</text>
    </g>

    <g>
      <text x="28" y="240" fill="#FF7A00">eli@github:~$</text>
      <text x="190" y="240" fill="#E6EDF3">status</text>
    </g>
    <g>
      <text x="28" y="271" fill="#C9D1D9">building / learning / shipping</text>
    </g>

    <g>
      <text x="28" y="306" fill="#FF7A00">›</text>
      <rect x="48" y="291" width="10" height="18" rx="1" fill="#FF5A1F" filter="url(#softGlow)">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>

